spring:
  datasource:
    url: jdbc:h2:mem:roomrental;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

app:
  jwt:
    secret: dev-only-secret-key-must-be-long-enough-for-hs512-algorithm-testing-purposes-only
