spring:
  application:
    name: room-rental-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

server:
  servlet:
    context-path: /
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:change-me-use-long-random-string-at-least-256-bits-for-hs512-in-production}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/return}
    ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay/ipn}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    api-url: https://generativelanguage.googleapis.com/v1beta/models
  listing:
    default-quota-per-month: 5

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: debug
    com.hust.roomrental: info
